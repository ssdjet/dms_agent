[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-claims-pipeline"
version = "0.1.0"
description = "Configurable foundations for DMS claims verification"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "xlrd>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["dms_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
